<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>マーケット・ライフ</title>
<style>
:root{--bg:#eceff3;--panel:#fff;--ink:#16213a;--sub:#5d6b82;--line:#d5dbe3;--up:#d62839;--down:#13897a;--land:#b8862f;--accent:#2f4b8a;--accent-ink:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#111620;--panel:#1b2231;--ink:#e8ecf4;--sub:#93a0b8;--line:#2e384d;--up:#ff6b7a;--down:#41c7b4;--land:#e0b261;--accent:#8fa8e8;--accent-ink:#111620;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "BIZ UDPGothic","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:1040px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:end;justify-content:space-between;margin-bottom:14px}
h1{margin:0;font-size:22px;letter-spacing:.04em}
.stats{display:flex;gap:24px}
.stats span{display:block;font-size:12px;color:var(--sub)}
.stats b{font-size:20px}
.goal{width:100%}
.goal div{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.goal i{display:block;height:100%;width:0;background:var(--accent)}
.goal small{color:var(--sub)}
main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px}
@media (max-width:760px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.ctitle{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
canvas{width:100%;height:240px;display:block}
.tabs{display:flex;gap:6px;margin:14px 0 8px}
button{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.row{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:10px 8px;border-top:1px solid var(--line);cursor:pointer;border-radius:6px}
.row:first-child{border-top:0}
.row.sel{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.row small{display:block;color:var(--sub)}
.pr{text-align:right;font-weight:700}
.pr.up{color:var(--up)}.pr.down{color:var(--down)}
.btns{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.btns button{padding:3px 9px;font-size:13px}
.land b{color:var(--land)}
.prize{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line)}
.news li{padding:7px 0;border-top:1px solid var(--line);list-style:none}
.news li:first-child{border-top:0}
.news ul{margin:0;padding:0}
.news .up{color:var(--up)}.news .down{color:var(--down)}
.news small{color:var(--sub);margin-right:8px}
#msg{min-height:22px;color:var(--land);font-weight:700}
.ctl{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
h2{font-size:15px;margin:0 0 6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>マーケット・ライフ</h1>
  <div class="stats">
    <div><span>経過日数</span><b id="day"></b></div>
    <div><span>現金</span><b id="cash"></b></div>
    <div><span>総資産</span><b id="net"></b></div>
  </div>
  <div class="goal"><div><i id="bar"></i></div><small id="goalt"></small></div>
</header>
<main>
  <div>
    <section class="card">
      <div class="ctitle"><b id="cname"></b><span id="cprice"></span></div>
      <canvas id="cv" role="img" aria-label="選択中の価格チャート"></canvas>
    </section>
    <div class="tabs" id="tabs">
      <button data-act="tab" data-id="stock">株</button>
      <button data-act="tab" data-id="land">土地</button>
      <button data-act="tab" data-id="lot">宝くじ</button>
    </div>
    <section class="card" id="board"></section>
  </div>
  <aside>
    <section class="card">
      <h2>進行スピード</h2>
      <div class="ctl" id="speed">
        <button data-act="speed" data-id="0">停止</button>
        <button data-act="speed" data-id="1000">標準</button>
        <button data-act="speed" data-id="300">高速</button>
        <button data-act="reset">最初から</button>
      </div>
      <div id="msg" aria-live="polite"></div>
    </section>
    <section class="card news" style="margin-top:14px">
      <h2>ニュース</h2>
      <ul id="news"></ul>
    </section>
  </aside>
</main>
</div>
<script>
const KEY='marketlife-v1',GOAL=10000000,TIX=300;
const $=id=>document.getElementById(id);
const yen=n=>'¥'+Math.round(n).toLocaleString('ja-JP');
const pick=a=>a[Math.floor(Math.random()*a.length)];
const rnd=()=>Math.random();

function stepStock(k){k.p=Math.max(10,Math.round(k.p*(1+(rnd()-.5)*2*k.vol+k.drift)));k.h.push(k.p);if(k.h.length>150)k.h.shift()}
function stepLand(l){l.p=Math.max(100000,Math.round(l.p*(1+(rnd()-.5)*2*l.vol+.0003)));l.h.push(l.p);if(l.h.length>150)l.h.shift()}

function fresh(){
  const st=[
    {id:'a',name:'海ノ星食品',p:1200,vol:.012,drift:.0004},
    {id:'b',name:'ミライ電機',p:3400,vol:.025,drift:.0003},
    {id:'c',name:'月面運輸',p:800,vol:.05,drift:0},
    {id:'d',name:'銀河ゲームス',p:2200,vol:.035,drift:.0002}];
  const ld=[
    {id:'x',name:'商店街の空き地',p:800000,rent:200,vol:.003},
    {id:'y',name:'駅前の角地',p:3000000,rent:800,vol:.005},
    {id:'z',name:'海沿いの広い土地',p:9000000,rent:2500,vol:.008}];
  st.forEach(k=>{k.h=[k.p];for(let i=0;i<60;i++)stepStock(k)});
  ld.forEach(l=>{l.h=[l.p];l.own=false;for(let i=0;i<60;i++)stepLand(l)});
  return{day:0,cash:1000000,hold:{},tix:0,stocks:st,lands:ld,log:[],sel:'a',tab:'stock',speed:1000,won:false};
}
let s;
try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!s||!s.stocks)s=fresh();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}};

const net=()=>s.cash+s.stocks.reduce((a,k)=>a+k.p*(s.hold[k.id]||0),0)+s.lands.reduce((a,l)=>a+(l.own?l.p:0),0);
const cur=()=>s.stocks.concat(s.lands).find(x=>x.id===s.sel)||s.stocks[0];
function note(t,up){s.log.unshift({d:s.day,t,up});s.log.length=Math.min(s.log.length,8)}
let mt;function msg(t){$('msg').textContent=t;clearTimeout(mt);mt=setTimeout(()=>$('msg').textContent='',2500)}

const EV=[['が好決算を発表',.09],['で不祥事が発覚',-.12],['が新製品を発売',.06],['に大口の買い注文',.05],['で工場トラブル',-.07],['が他社との提携を発表',.08]];
function event(){
  if(rnd()<.25){
    const l=pick(s.lands),up=rnd()<.6;
    l.p=Math.round(l.p*(up?1.12:.92));
    note(l.name+(up?'の周辺で再開発が決定。地価が上昇':'の周辺で人口流出が話題に。地価が下落'),up);return;
  }
  const k=pick(s.stocks),[t,e]=pick(EV);
  k.p=Math.max(10,Math.round(k.p*(1+e)));
  note(k.name+t,e>0);
}
const PRIZES=[['1等',3e6,1e-5,'10万分の1'],['2等',5e4,5e-4,'2,000分の1'],['3等',1e3,.05,'20分の1'],['4等',300,.1,'10分の1']];
function draw(){
  if(!s.tix)return;
  let win=0,top=null;
  for(let i=0;i<s.tix;i++){
    let r=rnd(),acc=0;
    for(const p of PRIZES){acc+=p[2];if(r<acc){win+=p[1];if(!top||p[1]>top[1])top=p;break}}
  }
  note(s.tix+'枚の抽選結果は'+(win?top[0]+'を含む当せん金 '+yen(win):'すべてはずれ'),win>0);
  s.cash+=win;s.tix=0;
}
function tick(){
  s.day++;
  s.stocks.forEach(stepStock);
  s.lands.forEach(l=>{stepLand(l);if(l.own)s.cash+=l.rent});
  if(rnd()<.06)event();
  if(s.day%7===0)draw();
  if(!s.won&&net()>=GOAL){s.won=true;note('目標の資産1,000万円を達成しました',true)}
  render();save();
}

function act(d){
  const id=d.id,n=d.n==='all'?Infinity:+d.n;
  if(d.act==='buy'){
    const k=s.stocks.find(x=>x.id===id),m=Math.min(n,Math.floor(s.cash/k.p));
    if(m<1)return msg('現金が足りません');
    s.cash-=m*k.p;s.hold[id]=(s.hold[id]||0)+m;
  }else if(d.act==='sell'){
    const k=s.stocks.find(x=>x.id===id),m=Math.min(n,s.hold[id]||0);
    if(m<1)return msg('売れる株がありません');
    s.cash+=m*k.p;s.hold[id]-=m;
  }else if(d.act==='land'){
    const l=s.lands.find(x=>x.id===id);
    if(l.own){s.cash+=l.p;l.own=false;msg(l.name+'を売却しました')}
    else if(s.cash>=l.p){s.cash-=l.p;l.own=true;msg(l.name+'を購入しました')}
    else return msg('現金が足りません');
  }else if(d.act==='tix'){
    const m=Math.min(n,Math.floor(s.cash/TIX));
    if(m<1)return msg('現金が足りません');
    s.cash-=m*TIX;s.tix+=m;
  }else if(d.act==='tab'){s.tab=id}
  else if(d.act==='speed'){setSpeed(+id)}
  else if(d.act==='reset'){if(confirm('進行状況を消して最初から始めますか?')){s=fresh();setSpeed(1000)}}
  render();save();
}
document.addEventListener('pointerdown',e=>{
  const b=e.target.closest('[data-act]');
  if(b){act(b.dataset);return}
  const r=e.target.closest('[data-sel]');
  if(r){s.sel=r.dataset.sel;render()}
});
document.addEventListener('click',e=>{
  if(e.detail!==0)return;
  const b=e.target.closest('[data-act]');
  if(b)act(b.dataset);
});

let timer;
function setSpeed(ms){clearInterval(timer);s.speed=ms;if(ms)timer=setInterval(tick,ms)}

function chg(it){
  const h=it.h,a=h[h.length-2]||h[h.length-1],r=(it.p-a)/a*100;
  return{cls:r>=0?'up':'down',txt:(r>=0?'▲ ':'▼ ')+Math.abs(r).toFixed(1)+'%'};
}
function board(){
  if(s.tab==='stock')return s.stocks.map(k=>{
    const q=s.hold[k.id]||0,c=chg(k);
    return `<div class="row ${s.sel===k.id?'sel':''}" data-sel="${k.id}">
      <div><b>${k.name}</b><small>保有 ${q}株</small><small>評価額 ${yen(q*k.p)}</small></div>
      <div class="pr ${c.cls}">${yen(k.p)}<small>${c.txt}</small></div>
      <div class="btns">
        <button data-act="buy" data-id="${k.id}" data-n="1">買 1</button>
        <button data-act="buy" data-id="${k.id}" data-n="10">買 10</button>
        <button data-act="buy" data-id="${k.id}" data-n="all">買 最大</button>
        <button data-act="sell" data-id="${k.id}" data-n="1">売 1</button>
        <button data-act="sell" data-id="${k.id}" data-n="10">売 10</button>
        <button data-act="sell" data-id="${k.id}" data-n="all">売 全部</button>
      </div></div>`}).join('');
  if(s.tab==='land')return s.lands.map(l=>{
    const c=chg(l);
    return `<div class="row land ${s.sel===l.id?'sel':''}" data-sel="${l.id}">
      <div><b>${l.name}</b><small>${l.own?'所有中':'未所有'}</small><small>家賃収入 ${yen(l.rent)} 毎日</small></div>
      <div class="pr ${c.cls}">${yen(l.p)}<small>${c.txt}</small></div>
      <div class="btns"><button data-act="land" data-id="${l.id}">${l.own?'売却する':'購入する'}</button></div></div>`}).join('');
  return `<p>1枚 ${yen(TIX)}。7日ごとに抽選します。</p>
    <p>所持 ${s.tix}枚、次の抽選まであと ${7-s.day%7}日</p>
    <div class="btns" style="display:flex;gap:6px;margin-bottom:10px">
      <button data-act="tix" data-n="1">1枚</button><button data-act="tix" data-n="10">10枚</button>
      <button data-act="tix" data-n="100">100枚</button><button data-act="tix" data-n="all">最大</button></div>
    ${PRIZES.map(p=>`<div class="prize"><span>${p[0]} ${p[3]}</span><b>${yen(p[1])}</b></div>`).join('')}`;
}
function chart(){
  const it=cur(),cv=$('cv'),dpr=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
  cv.width=w*dpr;cv.height=h*dpr;
  const c=cv.getContext('2d');c.scale(dpr,dpr);
  const d=it.h,mn=Math.min(...d),mx=Math.max(...d),pad=(mx-mn)*.15||1;
  const X=i=>w-8-(w-16)*(d.length-1-i)/149,Y=v=>h-16-(h-32)*(v-mn+pad)/(mx-mn+2*pad);
  const css=getComputedStyle(document.documentElement);
  c.strokeStyle=css.getPropertyValue('--line');c.lineWidth=1;
  for(let i=0;i<4;i++){const y=16+(h-32)*i/3;c.beginPath();c.moveTo(0,y);c.lineTo(w,y);c.stroke()}
  c.strokeStyle=css.getPropertyValue(d[d.length-1]>=d[0]?'--up':'--down');c.lineWidth=2;c.lineJoin='round';
  c.beginPath();d.forEach((v,i)=>i?c.lineTo(X(i),Y(v)):c.moveTo(X(i),Y(v)));c.stroke();
  c.fillStyle=css.getPropertyValue('--sub');c.font='11px sans-serif';
  c.fillText(yen(mx),6,12);c.fillText(yen(mn),6,h-4);
}
function render(){
  $('day').textContent=s.day+'日目';
  $('cash').textContent=yen(s.cash);
  const n=net();
  $('net').textContent=yen(n);
  $('bar').style.width=Math.min(100,n/GOAL*100)+'%';
  $('goalt').textContent='目標 総資産 '+yen(GOAL)+'(達成率 '+Math.min(100,n/GOAL*100).toFixed(1)+'%)';
  const it=cur();
  $('cname').textContent=it.name;
  $('cprice').textContent=yen(it.p);
  $('board').innerHTML=board();
  $('news').innerHTML=s.log.length?s.log.map(l=>`<li class="${l.up?'up':'down'}"><small>${l.d}日目</small>${l.t}</li>`).join(''):'<li>まだニュースはありません。</li>';
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===s.tab));
  document.querySelectorAll('#speed button[data-act=speed]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.id===s.speed));
  chart();
}
addEventListener('resize',chart);
setSpeed(s.speed);
render();
</script>
</body>
</html>
